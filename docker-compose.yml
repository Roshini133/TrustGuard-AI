# Local development: docker compose up --build
# Open http://localhost:8080  (API docs: http://localhost:8000/api/docs)
x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-only-secret-key-change-me-please-0123456789}
  SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me-0123456789}
  DATABASE_URL: postgresql://trustguard:trustguard@db:5432/trustguard
  REDIS_URL: redis://redis:6379/0
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
  BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  OTP_EXPIRY_SECONDS: ${OTP_EXPIRY_SECONDS:-300}
  OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
  OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
  OTP_MAX_RESENDS: ${OTP_MAX_RESENDS:-5}
  PASSWORD_RESET_EXPIRY_SECONDS: ${PASSWORD_RESET_EXPIRY_SECONDS:-900}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
  FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-}
  ARTIFACT_STORAGE_BACKEND: local
  ARTIFACT_STORAGE_PATH: /data/artifacts
  JOBS_MODE: celery

services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: trustguard, POSTGRES_PASSWORD: trustguard, POSTGRES_DB: trustguard }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U trustguard -d trustguard"], interval: 5s, timeout: 3s, retries: 20 }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }

  api:
    build: ./backend
    command: ["api"]
    environment: { <<: *backend-env, RUN_MIGRATIONS: "1" }
    ports: ["8000:8000"]
    volumes: [artifacts:/data/artifacts]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "curl", "-fs", "http://localhost:8000/health/ready"], interval: 10s, timeout: 5s, retries: 12, start_period: 20s }
    restart: unless-stopped

  worker:   # Celery worker + scheduler (-B): background jobs and hourly cleanup of expired OTPs/tokens/sessions
    build: ./backend
    command: ["worker"]
    environment: *backend-env
    volumes: [artifacts:/data/artifacts]
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped

  web:
    build: ./frontend
    environment: { PORT: "8080", BACKEND_HOSTPORT: "api:8000" }
    ports: ["8080:8080"]
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  artifacts:
